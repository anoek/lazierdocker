[package]
name = "lazierdocker"
version = "0.1.0"
edition = "2021"
description = "A mouse-first terminal UI for Docker"
license = "MIT"

[workspace]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bollard = "0.21"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3.34"
libghostty-vt = "0.2.2"
portable-pty = "0.9"
ratatui = "0.30"
serde_json = "1.0.154"
tokio = { version = "1", features = ["full"] }
unicode-width = "0.2"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
